<!-- @dsCard group="Colors" viewport="700x150" name="Ink & Neutrals" subtitle="Text inks, placeholder greys, paper & canvas" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff;padding:18px;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;}
  .chip{height:64px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(16,48,61,.08);}
  .name{font-size:11px;font-weight:700;color:var(--ink-900);margin-top:7px;}
  .hex{font-size:10px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="name">ink-900 body</div><div class="hex">#10303D</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="name">ink-700</div><div class="hex">#244A59</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="name">ink-500</div><div class="hex">#4F6B78</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-400)"></div><div class="name">slate-400 muted</div><div class="hex">#818285</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-200)"></div><div class="name">slate-200</div><div class="hex">#DDE2E5</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-100)"></div><div class="name">slate-100</div><div class="hex">#EEF1F3</div></div>
    <div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="name">paper</div><div class="hex">#FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background:var(--canvas)"></div><div class="name">canvas</div><div class="hex">#CFD2D4</div></div>
  </div>
</body></html>
