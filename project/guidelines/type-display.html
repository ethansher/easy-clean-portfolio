<!-- @dsCard group="Type" viewport="700x180" name="Display — Archivo" subtitle="Uppercase headings, tracked out, weights 700–800" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff;padding:20px;color:var(--ink-900);}
  .t{font-family:var(--font-display);text-transform:uppercase;letter-spacing:var(--ls-title);line-height:1.05;}
  .meta{font-size:10px;color:var(--text-muted);margin-top:3px;letter-spacing:.02em;text-transform:none;}
  .stack > * + *{margin-top:14px;}
</style></head>
<body>
  <div class="stack">
    <div><div class="t" style="font-size:44px;font-weight:800;">Identification</div><div class="meta">--fs-display 44 · 800 · --ls-title</div></div>
    <div><div class="t" style="font-size:26px;font-weight:800;color:var(--cyan-500);">Areas of Investigation</div><div class="meta">--fs-title 26 · 800 · section heading</div></div>
    <div><div class="t" style="font-size:18px;font-weight:700;color:var(--cyan-500);">The Problem</div><div class="meta">--fs-subtitle 18 · 700 · card heading</div></div>
  </div>
</body></html>
