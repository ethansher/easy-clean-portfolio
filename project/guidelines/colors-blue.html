<!-- @dsCard group="Colors" viewport="700x150" name="Brand Blue" subtitle="Sky-blue page scale — --blue-50…700, field = --blue-400" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff;padding:18px;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;}
  .chip{height:64px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(16,48,61,.06);}
  .name{font-size:11px;font-weight:700;color:var(--ink-900);margin-top:7px;}
  .hex{font-size:10px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--blue-50)"></div><div class="name">blue-50</div><div class="hex">#EEF7FB</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-100)"></div><div class="name">blue-100</div><div class="hex">#D3ECF5</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-200)"></div><div class="name">blue-200</div><div class="hex">#AADCEC</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-300)"></div><div class="name">blue-300</div><div class="hex">#82CBE3</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-400);box-shadow:inset 0 0 0 2px var(--ink-900)"></div><div class="name">blue-400 ★ page</div><div class="hex">#6AB9D9</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-500)"></div><div class="name">blue-500</div><div class="hex">#4AA7CD</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-600)"></div><div class="name">blue-600</div><div class="hex">#2F8FBB</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-700)"></div><div class="name">blue-700</div><div class="hex">#25728F</div></div>
  </div>
</body></html>
