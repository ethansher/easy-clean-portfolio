<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);display:flex;height:100vh;}
  .pane{flex:1;display:grid;place-items:center;}
  .light{background:#fff;}
  .blue{background:var(--blue-400);}
  .blue img{filter:brightness(0) invert(1);}
  img{width:230px;height:auto;}
</style></head>
<body>
  <div class="pane light"><img src="../assets/logo.svg" alt="CarKit logo"></div>
  <div class="pane blue"><img src="../assets/logo.svg" alt="CarKit logo reversed"></div>
</body></html>
