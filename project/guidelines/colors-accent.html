<!-- @dsCard group="Colors" viewport="700x150" name="Accent — Electric Blue & Orange" subtitle="Header bands (--cyan-400) and the orange data accent (--orange-400)" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff;padding:18px;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;}
  .chip{height:64px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(16,48,61,.06);}
  .name{font-size:11px;font-weight:700;color:var(--ink-900);margin-top:7px;}
  .hex{font-size:10px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
  .sep{width:1px;background:var(--slate-200);margin:0 4px;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--cyan-300)"></div><div class="name">cyan-300</div><div class="hex">#5CCBF4</div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-400)"></div><div class="name">cyan-400 ★ band</div><div class="hex">#00ADEF</div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-500)"></div><div class="name">cyan-500 link</div><div class="hex">#0090C9</div></div>
    <div class="sep"></div>
    <div class="sw"><div class="chip" style="background:var(--orange-300)"></div><div class="name">orange-300</div><div class="hex">#FFB163</div></div>
    <div class="sw"><div class="chip" style="background:var(--orange-400)"></div><div class="name">orange-400 ★</div><div class="hex">#F5821F</div></div>
    <div class="sw"><div class="chip" style="background:var(--orange-500)"></div><div class="name">orange-500</div><div class="hex">#D96C0C</div></div>
  </div>
</body></html>
