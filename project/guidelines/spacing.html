<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base step — --space-1…12 + page composition tokens" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff;padding:20px;color:var(--ink-900);}
  .row{display:flex;align-items:flex-end;gap:14px;}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar{background:var(--cyan-400);border-radius:3px;width:22px;}
  .lab{font-size:10px;color:var(--text-muted);}
  .v{font-size:10px;font-weight:700;}
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="height:4px"></div><div class="v">1</div><div class="lab">4</div></div>
    <div class="col"><div class="bar" style="height:8px"></div><div class="v">2</div><div class="lab">8</div></div>
    <div class="col"><div class="bar" style="height:12px"></div><div class="v">3</div><div class="lab">12</div></div>
    <div class="col"><div class="bar" style="height:16px"></div><div class="v">4</div><div class="lab">16</div></div>
    <div class="col"><div class="bar" style="height:20px"></div><div class="v">5</div><div class="lab">20</div></div>
    <div class="col"><div class="bar" style="height:24px"></div><div class="v">6</div><div class="lab">24</div></div>
    <div class="col"><div class="bar" style="height:32px"></div><div class="v">8</div><div class="lab">32</div></div>
    <div class="col"><div class="bar" style="height:40px"></div><div class="v">10</div><div class="lab">40</div></div>
    <div class="col"><div class="bar" style="height:48px"></div><div class="v">12</div><div class="lab">48</div></div>
  </div>
</body></html>
