<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy Clean — Major Work Portfolio (40 × A3)</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;background:#9aa0a4;font-family:var(--font-body);}
  .doc{display:flex;flex-direction:column;align-items:center;gap:26px;padding:26px 0;}
  .sheet{width:420mm;height:297mm;overflow:hidden;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.28);}
  .scale{width:1480px;height:1046px;transform:scale(1.0723);transform-origin:top left;}
  @media print{
    @page{size:A3 landscape;margin:0;}
    html,body{background:#fff;}
    .doc{gap:0;padding:0;}
    .sheet{box-shadow:none;page-break-after:always;break-after:page;}
    .sheet:last-child{page-break-after:auto;}
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="pages.jsx"></script>
</head>
<body>
<div class="doc" id="doc"></div>
<script type="text/babel">
const { PLAN, renderPage } = window.EasyCleanPages;
const doc = document.getElementById('doc');
PLAN.forEach((entry, i) => {
  const sheet = document.createElement('div'); sheet.className = 'sheet';
  const scale = document.createElement('div'); scale.className = 'scale';
  sheet.appendChild(scale); doc.appendChild(sheet);
  ReactDOM.createRoot(scale).render(renderPage(entry, i));
});
</script>
</body></html>
