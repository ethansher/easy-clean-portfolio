<!-- @dsCard group="Portfolio" viewport="1480x1046" name="Portfolio viewer (40 A3 pages)" subtitle="Click-through Easy Clean major-work portfolio — every section layout" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy Clean — Major Work Portfolio</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;height:100%;background:#9aa0a4;font-family:var(--font-body);}
  #stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;}
  #page{position:absolute;left:50%;top:50%;width:1480px;height:1046px;transform-origin:center;}
  .nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:14px;background:rgba(16,48,61,.85);
    backdrop-filter:blur(6px);padding:8px 16px;border-radius:var(--radius-pill);z-index:10;}
  .nav button{appearance:none;border:none;background:transparent;color:#fff;cursor:pointer;
    font-family:var(--font-display);font-weight:700;font-size:20px;width:32px;height:32px;border-radius:50%;}
  .nav button:hover{background:rgba(255,255,255,.16);}
  .nav .lbl{color:#fff;font-size:12px;font-weight:700;letter-spacing:.03em;min-width:230px;text-align:center;text-transform:uppercase;}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="pages-bundle.js"></script>
</head>
<body>
<div id="stage"><div id="page"><div id="root"></div></div></div>
<div class="nav">
  <button id="prev">&#8249;</button>
  <span class="lbl" id="lbl"></span>
  <button id="next">&#8250;</button>
</div>
<script>
const TITLES = {
  cover:'Cover',need:'Identification of the Need',investigation:'Areas of Investigation',
  interviews:'Interviews → Criteria',criteria:'Criteria to Evaluate Success',
  action:'Action, Time & Finance',existing:'Exploration of Existing Designs',
  sketches:'Sketches',creativity:'Further Evidence of Creativity',
  consideration:'Consideration of Design Factors',testing:'Experimentation & Testing',
  justification:'Justification of Tools / Materials',practical:'Evidence of Practical Skills',
  evaluation:'Project Evaluation',impact:'Impact on Society / Environment',final:'Final Evaluation'
};
const { PLAN, renderPage } = window.EasyCleanPages;
const KEY = 'easyclean-portfolio-page';
let idx = Math.min(PLAN.length - 1, parseInt(localStorage.getItem(KEY) || '0', 10) || 0);
const root = ReactDOM.createRoot(document.getElementById('root'));
function fit() {
  const s = Math.min((innerWidth - 48) / 1480, (innerHeight - 90) / 1046);
  document.getElementById('page').style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
function go(i) {
  idx = (i + PLAN.length) % PLAN.length;
  localStorage.setItem(KEY, String(idx));
  root.render(renderPage(PLAN[idx], idx));
  document.getElementById('lbl').textContent = (idx + 1) + ' / ' + PLAN.length + ' \xB7 ' + TITLES[PLAN[idx].t];
}
document.getElementById('prev').onclick = function() { go(idx - 1); };
document.getElementById('next').onclick = function() { go(idx + 1); };
addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') go(idx + 1);
  if (e.key === 'ArrowLeft') go(idx - 1);
});
addEventListener('resize', fit);
fit(); go(idx);
</script>
</body></html>
